<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Md Selim Sarowar</title>
  <desc id="desc">M.Sc. researcher in 3D computer vision, vision-language-action models, world models and agentic robotics at the Advanced Visual Intelligence Lab, Yeungnam University.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f5f7fb"/>
    </linearGradient>
    <radialGradient id="glowR" cx="0.86" cy="0.45" r="0.40">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowL" cx="0.0" cy="1.0" r="0.5">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="card"><rect width="1200" height="300" rx="18"/></clipPath>
  </defs>
  <style>
    text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
    .eyebrow { font-size: 13px; font-weight: 600; letter-spacing: 3.5px; fill: #2563eb; }
    .name { font-size: 58px; font-weight: 800; letter-spacing: -1.2px; fill: #0f172a; }
    .sub { font-size: 19px; fill: #475569; }
    .label { font-size: 12px; font-weight: 600; letter-spacing: 3px; fill: #64748b; }
    .focus { font-size: 28px; font-weight: 700; letter-spacing: -0.3px; fill: url(#accent); opacity: 0; animation: cycle 15s ease-in-out infinite; }
    /* Where animation never runs, the first focus line still shows. */
    .f0 { opacity: 1; }
    .f0 { animation-delay: 0s; }
    .f1 { animation-delay: 3s; }
    .f2 { animation-delay: 6s; }
    .f3 { animation-delay: 9s; }
    .f4 { animation-delay: 12s; }
    .ring { transform-origin: 1010px 150px; animation: spin 60s linear infinite; }
    .cube { animation: float 7s ease-in-out infinite; }
    .twinkle { animation: twinkle 2.8s ease-in-out infinite; }
    .t1 { animation-delay: 0.4s; } .t2 { animation-delay: 0.8s; } .t3 { animation-delay: 1.2s; }
    .t4 { animation-delay: 1.6s; } .t5 { animation-delay: 2s; }
    @keyframes cycle {
      0% { opacity: 0; transform: translateY(8px); }
      3.00% { opacity: 1; transform: translateY(0); }
      17.00% { opacity: 1; transform: translateY(0); }
      20.00% { opacity: 0; transform: translateY(-8px); }
      100% { opacity: 0; }
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    @keyframes twinkle { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#glowL)"/>
    <rect width="1200" height="300" fill="url(#glowR)"/>
    <rect width="1200" height="3" fill="url(#accent)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="18" fill="none" stroke="#d0d7de"/>

  <text class="eyebrow" x="64" y="76">PHYSICAL SUPER INTELLIGENCE  ·  EMBODIED AI</text>
  <text class="name" x="61" y="136">Md Selim Sarowar</text>
  <text class="sub" x="64" y="172">M.Sc. Researcher  ·  Advanced Visual Intelligence Lab, Yeungnam University</text>
  <rect x="64" y="198" width="44" height="2" rx="1" fill="url(#accent)"/>
  <text class="label" x="64" y="230">CURRENT FOCUS</text>
  <text class="focus f0" x="64" y="266">World Models &amp; Latent Planning</text>
  <text class="focus f1" x="64" y="266">Vision-Language-Action Models</text>
  <text class="focus f2" x="64" y="266">Agentic Robotics for Manipulation</text>
  <text class="focus f3" x="64" y="266">3D Spatial Intelligence &amp; 6D Pose</text>
  <text class="focus f4" x="64" y="266">Physical Super Intelligence</text>

  <!-- Right: a cube (perception) inside two orbits (prediction) and a slow dashed ring. -->
  <circle class="ring" cx="1010" cy="150" r="124" fill="none" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="2 10"/>

  <g transform="rotate(-20 1010 150)">
    <ellipse cx="1010" cy="150" rx="146" ry="44" fill="none" stroke="url(#accent)" stroke-opacity="0.55" stroke-width="1.3"/>
    <circle r="4.5" fill="#2563eb" filter="url(#glow)">
      <animateMotion dur="10s" repeatCount="indefinite" path="M864,150 a146,44 0 1,0 292,0 a146,44 0 1,0 -292,0"/>
    </circle>
  </g>
  <g transform="rotate(28 1010 150)">
    <ellipse cx="1010" cy="150" rx="132" ry="36" fill="none" stroke="url(#accent)" stroke-opacity="0.40" stroke-width="1.1"/>
    <circle r="4" fill="#7c3aed" filter="url(#glow)">
      <animateMotion dur="14s" repeatCount="indefinite" path="M878,150 a132,36 0 1,1 264,0 a132,36 0 1,1 -264,0"/>
    </circle>
  </g>

  <g class="cube">
    <polygon points="1010.0,96.0 1056.8,123.0 1010.0,150.0 963.2,123.0" fill="#3b82f6" fill-opacity="0.18"/>
    <polygon points="963.2,123.0 1010.0,150.0 1010.0,204.0 963.2,177.0" fill="#8b5cf6" fill-opacity="0.24"/>
    <polygon points="1010.0,150.0 1056.8,123.0 1056.8,177.0 1010.0,204.0" fill="#3b82f6" fill-opacity="0.10"/>
    <g fill="none" stroke="#1d4ed8" stroke-width="1.5" stroke-linejoin="round" stroke-opacity="0.85">
      <polygon points="1010.0,96.0 1056.8,123.0 1056.8,177.0 1010.0,204.0 963.2,177.0 963.2,123.0"/>
      <polyline points="963.2,123.0 1010.0,150.0 1056.8,123.0"/>
      <line x1="1010.0" y1="150.0" x2="1010.0" y2="204.0"/>
    </g>
    <g fill="#1d4ed8">
      <circle class="twinkle"    cx="994" cy="120" r="2"/>
      <circle class="twinkle t1" cx="1030" cy="112" r="1.8"/>
      <circle class="twinkle t2" cx="980" cy="164" r="2"/>
      <circle class="twinkle t3" cx="992" cy="184" r="1.6"/>
      <circle class="twinkle t4" cx="1036" cy="158" r="2"/>
      <circle class="twinkle t5" cx="1044" cy="182" r="1.6"/>
    </g>
  </g>
</svg>
